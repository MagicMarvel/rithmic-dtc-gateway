[package]
name = "rithmic-dtc-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[[bin]]
name = "rithmic_probe"
path = "src/bin/rithmic_probe.rs"

[[bin]]
name = "dtc_server"
path = "src/bin/dtc_server.rs"

[dependencies]
dotenvy = "0.15"
rand = "0.10"
rithmic-rs = "3.1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
