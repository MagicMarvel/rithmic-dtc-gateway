name: rithmic-dtc-gateway

services:
  gateway:
    image: odt/rithmic-dtc-gateway:${ODT_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: gateway.env
    environment:
      DTC_LISTEN_ADDR: 0.0.0.0:11099
      DTC_ADMIN_LISTEN_ADDR: 0.0.0.0:11100
      DTC_ACCOUNTS_FILE: /data/accounts.json
    ports:
      - "127.0.0.1:11099:11099"
      - "127.0.0.1:11100:11100"
    volumes:
      - ./data/gateway:/data
