name: odt-terminal

services:
  gateway:
    image: odt/rithmic-dtc-gateway:${ODT_IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: gateway.env
    environment:
      DTC_LISTEN_ADDR: 0.0.0.0:11099
      DTC_ADMIN_LISTEN_ADDR: 0.0.0.0:11100
      DTC_ACCOUNTS_FILE: /data/accounts.json
    expose:
      - "11099"
      - "11100"
    volumes:
      - ./data/gateway:/data
    networks:
      - private

  web:
    image: odt/rithmic-web-terminal:${ODT_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - gateway
    env_file: web.env
    environment:
      DTC_GATEWAY_ADDR: gateway:11099
      DTC_GATEWAY_ADMIN_URL: http://gateway:11100
      TERMINAL_HTTP_LISTEN_ADDR: 0.0.0.0:11200
      RITHMIC_ENABLE_TRADING: "true"
      RITHMIC_TRADING_CONNECTION_FILE: /data/trading-connection.json
    ports:
      - "127.0.0.1:11200:11200"
    volumes:
      - ./data/web:/data
    networks:
      - private

networks:
  private:
    driver: bridge
